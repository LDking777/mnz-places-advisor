version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 8 y Vitest 5 requieren Node 22.12 o superior
            - nvm install 22
            - nvm use 22
            - node --version
            - npm ci
            - npm run lint
            - npm test
        build:
          commands:
            # VITE_API_BASE_URL llega desde las variables de entorno de cada rama en Amplify
            - echo "Compilando con VITE_API_BASE_URL=$VITE_API_BASE_URL"
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
